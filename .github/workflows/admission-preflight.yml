name: 20i admission preflight
on:
  pull_request:
    paths:
      - 'tools/validate-admission.mjs'
      - 'tests/validate-admission.test.mjs'
      - '.github/workflows/admission-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check tools/validate-admission.mjs
          node --check tests/validate-admission.test.mjs
      - name: Negative and boundary tests
        run: node --test tests/validate-admission.test.mjs
