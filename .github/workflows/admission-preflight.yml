name: 20i admission preflight
on:
  pull_request:
    paths:
      - 'tools/validate-admission.mjs'
      - 'tests/validate-admission.test.mjs'
      - 'tests/validate-admission-cli.test.mjs'
      - '.github/workflows/admission-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check tools/validate-admission.mjs
          node --check tests/validate-admission.test.mjs
          node --check tests/validate-admission-cli.test.mjs
      - name: Negative and boundary tests
        run: node --test tests/validate-admission.test.mjs tests/validate-admission-cli.test.mjs
