name: Software Savings Hub offline WXR intake
on:
  pull_request:
    paths:
      - 'tools/check_ssh_wxr_intake.py'
      - 'tests/test_ssh_wxr_intake.py'
      - '.github/workflows/ssh-wxr-intake.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Synthetic WXR structural tests
        run: python -m unittest discover -s tests -p test_ssh_wxr_intake.py -v
