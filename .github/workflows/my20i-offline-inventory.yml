name: My20i offline inventory redaction
on:
  pull_request:
    paths:
      - 'tools/summarize-my20i-packages.mjs'
      - 'tests/summarize-my20i-packages.test.mjs'
      - 'docs/my20i/**'
      - '.github/workflows/my20i-offline-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-safety-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check tools/summarize-my20i-packages.mjs
          node --check tests/summarize-my20i-packages.test.mjs
      - name: Offline synthetic package JSON safety tests
        run: node --test tests/summarize-my20i-packages.test.mjs
