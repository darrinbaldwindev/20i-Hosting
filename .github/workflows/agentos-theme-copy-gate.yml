name: AgentOS WordPress draft claim gate
on:
  pull_request:
    paths:
      - 'tools/validate-agentos-theme-copy.mjs'
      - 'tests/validate-agentos-theme-copy.test.mjs'
      - 'docs/agentos-commercial/**'
      - '.github/workflows/agentos-theme-copy-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-claim-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check tools/validate-agentos-theme-copy.mjs
          node --check tests/validate-agentos-theme-copy.test.mjs
      - name: Read-only negative and safety tests
        run: node --test tests/validate-agentos-theme-copy.test.mjs
